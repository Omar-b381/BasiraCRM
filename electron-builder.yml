appId: com.mwasem.crm
productName: "بصيرة CRM"
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "بصيرة CRM"
  uninstallDisplayName: "بصيرة CRM - إلغاء التثبيت"
