appId: com.mwasem.crm
productName: "بصيرة CRM"
directories:
  output: release-prod
asar: false
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/.cache/**/*"
  - "!node_modules/**/{README.md,CHANGELOG.md,*.map}"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "بصيرة CRM"
  uninstallDisplayName: "بصيرة CRM - إلغاء التثبيت"
